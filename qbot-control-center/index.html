// Keep programme IDs P0-P6 independent from human-readable priority labels.
const PRIORITY_OPTIONS=['CRITIQUE','HAUTE','NORMALE'];
function normalizePriority(value){return ({P1:'HAUTE',P2:'NORMALE',P3:'NORMALE',critical:'CRITIQUE',high:'HAUTE',normal:'NORMALE'})[value]||(PRIORITY_OPTIONS.includes(value)?value:'NORMALE')}
function priorityBadge(value){const label=normalizePriority(value);return '<span class="priority-tag '+label.toLowerCase()+'">'+esc(label)+'</span>'}
function missionRef(t){return t.ref||t.project+'-??'}
function nextMissionRef(d,projectId){d.taskCounters=d.taskCounters||{};const known=Math.max(0,...d.tasks.filter(t=>t.project===projectId).map(t=>{const m=String(t.ref||'').match(new RegExp('^'+projectId+'-(\\d+)$'));return m?Number(m[1]):0}));const next=Math.max(known,Number(d.taskCounters[projectId])||0)+1;d.taskCounters[projectId]=next;return projectId+'-'+String(next).padStart(2,'0')}
function migrateNomenclature(d){
  if(!d.taskCounters||typeof d.taskCounters!=='object')d.taskCounters={};
  for(const p of d.projects)p.priority=normalizePriority(p.priority);
  for(const t of d.tasks)t.priority=normalizePriority(t.priority);
  for(const t of d.tasks){const m=String(t.ref||'').match(new RegExp('^'+t.project+'-(\\d+)$'));if(m)d.taskCounters[t.project]=Math.max(Number(d.taskCounters[t.project])||0,Number(m[1]));}
  for(const t of d.tasks)if(!t.ref)t.ref=nextMissionRef(d,t.project);
  if((d.nomenclatureVersion||0)<1){
    const baseline=d.tasks.find(t=>t.id==='T04');
    if(baseline&&baseline.priority==='HAUTE')baseline.priority='CRITIQUE';
    d.nomenclatureVersion=1;
  }
  return d;
}

let qbotServerText='Synthèse GitHub publique non chargée.';
function paintServerStatus(){const el=document.getElementById('qbot-server-status');if(el)el.textContent=qbotServerText}
async function updateServerStatus(){
 try{
  const res=await fetch('https://raw.githubusercontent.com/giniusconcept/Nova10-Store/qbot-public-site/qbot-control-center/qbot-public-status.json',{cache:'no-store'});
  if(!res.ok)throw new Error('no public data');
  const v=await res.json();
  if(v.schema_version!==1||v.mode!=='RESEARCH_ONLY'||!Array.isArray(v.programs))throw new Error('invalid public data');
  const metric=k=>v.programs.reduce((sum,p)=>sum+(Number.isSafeInteger(p[k])&&p[k]>=0?p[k]:0),0);
  const dt=Date.parse(v.updated_at_utc);
  const ts=Number.isFinite(dt)?new Date(dt).toLocaleString('fr-FR',{timeZone:'Europe/Paris',dateStyle:'short',timeStyle:'short'}):'date inconnue';
  const stale=!Number.isFinite(dt)||Date.now()-dt>3*60*60*1000;
  qbotServerText='MISSIONS SERVEUR : '+metric('completed')+'/'+metric('total')+' contrôles validés · '+metric('awaiting_human')+' en attente humaine · '+metric('blocked')+' bloqués · '+ts+(stale?' (statut ancien)':'')+' · synthèse publique seulement';
 }catch(e){qbotServerText='Synthèse distante non accessible. Les actions locales sont inchangées.'}
 paintServerStatus();
}

const P5_MILESTONES=[1000,2000,5000,10000,25000,50000,100000];
function renderP5Tracker(){
 const x=state.p5||SEED.p5,balance=Math.max(0,Number(x.balance)||0),target=100000,base=1000;
 const pct=Math.max(0,Math.min(100,100*Math.log(Math.max(1,balance)/base)/Math.log(target/base)));
 const next=P5_MILESTONES.find(v=>v>balance)||target;
 const g=Math.max(0.001,Number(x.scenarioPct)||1)/100;
 const iterations=balance>0&&balance<target?Math.ceil(Math.log(target/balance)/Math.log(1+g)):balance>=target?0:null;
 const risk=Math.max(0,Math.min(100,Number(x.riskPct)||1))/100;
 const afterLosses=balance*Math.pow(1-risk,10);
 return `<section class="panel" style="margin-top:15px;border-color:#276d73" id="p5-tracker"><div class="p5-header"><div><div class="eyebrow">P5 / FONDS PROPRES · SUIVI MANUEL</div><h3 style="margin:6px 0">Capital Challenge</h3><div class="p5-target">1 000 $ → 100 000 $</div></div>${pill('cadrage','Objectif ×100 · non garanti')}</div><div class="p5-progress"><i style="width:${pct}%"></i></div><div class="muted tiny">${fmt(pct)} % du parcours logarithmique entre 1K et 100K · ${fmt(balance)} $ saisis · prochain palier ${fmt(next)} $</div><div class="p5-milestones">${P5_MILESTONES.map(v=>`<div class="p5-milestone ${balance>=v?'hit':v===next?'next':''}">${v>=1000?fmt(v/1000)+'K':fmt(v)} $</div>`).join('')}</div><div class="p5-inputs"><div class="formfield"><label>Capital suivi ($)</label><input class="fieldinput" type="number" min="0" step="10" data-p5="balance" value="${esc(x.balance)}"></div><div class="formfield"><label>Scénario net / itération (%)</label><input class="fieldinput" type="number" min="0.1" max="25" step="0.25" data-p5="scenarioPct" value="${esc(x.scenarioPct)}"></div><div class="formfield"><label>Risque / trade (%)</label><input class="fieldinput" type="number" min="0.1" max="10" step="0.25" data-p5="riskPct" value="${esc(x.riskPct)}"></div></div><div class="p5-stats"><div class="tile"><span class="muted small">Multiplicateur atteint</span><b>×${fmt(balance/base)}</b></div><div class="tile"><span class="muted small">Itérations hypothétiques restantes</span><b>${iterations===null?'—':fmt(iterations)}</b></div><div class="tile"><span class="muted small">Après 10 pertes de suite</span><b>${fmt(afterLosses)} $</b></div></div><div class="source">Scénario déterministe : n = ⌈ln(cible/capital)/ln(1+rendement net par itération)⌉. Il n'inclut pas de séquence réelle de pertes ni les contraintes de marge. Les 10 pertes utilisent uniquement le risque/trade saisi, hors slippage et frais supplémentaires.</div><div class="p5-disclaimer">Objectif spéculatif, sans probabilité de réussite certifiée. Un capital de 1 000 $ peut être intégralement perdu. Valeurs saisies localement, non connectées à un broker ; par défaut le solde est un point de départ de simulation, pas une position réelle.</div></section>`;
}

function renderDetail(id){const p=project(id);if(!p)return '';const ts=state.tasks.filter(t=>t.project===id);return `<section class="project-detail" id="project-detail"><div class="detail-head"><div><div class="eyebrow">FICHE DE COMMANDE · ${p.id}</div><h2 style="font-size:23px;margin-bottom:4px">${esc(p.name)}</h2><div class="muted small">${esc(p.desc)}</div></div><button class="btn sm" data-editproject="${p.id}">✎ Modifier</button></div><div class="detail-grid"><div class="field"><label>STATUT DÉCLARÉ</label>${pill(p.status)}</div><div class="field"><label>PRIORITÉ / PILOTE</label><strong>${priorityBadge(p.priority)} · ${esc(p.owner)}</strong></div><div class="field"><label>PROCHAIN JALON</label><strong>${esc(p.next)}</strong></div><div class="field"><label>RISQUE MAJEUR</label><strong class="warning">${esc(p.risk)}</strong></div></div><div class="sep"></div><div class="tags">${p.stack.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>${p.id==='P5'?renderP5Tracker():''}<div class="sep"></div><div class="panel-header"><h3 style="margin:0">Actions rattachées (${ts.length})</h3><button class="btn sm" data-create-for="${p.id}">＋ Ajouter</button></div><div class="action-list">${ts.map(t=>`<div class="action"><span class="num" style="font-size:12px">${t.status==='done'?'✓':t.status==='blocked'?'!':'·'}</span><div style="flex:1"><div class="action-title">${esc(t.title)}</div><div class="meta">${esc(missionRef(t))} · ${pill(t.status)} · ${priorityBadge(t.priority)}</div></div><button class="open" data-task="${t.id}">↗</button></div>`).join('')}</div></section>`}
function renderStrategies(){const filtered=state.strategies.filter(s=>(filter==='all'||s.status===filter)&&(s.name+' '+s.proof+' '+s.next).toLowerCase().includes(query.toLowerCase()));return `<section class="section-head"><div><div class="eyebrow">BOT REGISTRY</div><h1>Portefeuille de stratégies</h1><p class="headline-sub">Preuve opérationnelle, résultats annoncés et validation indépendante sont volontairement distingués.</p></div></section><section class="panel"><div class="task-toolbar"><input id="filter-search" class="fieldinput" style="max-width:340px" placeholder="Rechercher une stratégie" value="${esc(query)}"></div><div class="tabfilter">${[['all','Toutes'],['operational','Opérationnelles'],['reference','Références'],['testing','Backtest / test'],['research','Recherche']].map(([k,n])=>`<button class="filter ${filter===k?'active':''}" data-filter="${k}">${n}</button>`).join('')}</div><div class="tablewrap"><table class="tbl"><thead><tr><th>Stratégie</th><th>Statut</th><th>Preuve disponible</th><th>Prochaine étape</th></tr></thead><tbody>${filtered.map(s=>`<tr><td><b>${esc(s.name)}</b><br><small>${esc(s.area)}</small></td><td>${pill(s.status)}</td><td>${esc(s.proof)}<br><small>${esc(s.confidence)}</small></td><td>${esc(s.next)}</td></tr>`).join('')}</tbody></table>${filtered.length?'':'<div class="empty">Aucune stratégie ne correspond à la recherche.</div>'}</div><div class="source">Les taux de réussite signalés dans l'historique du projet ne constituent pas des performances garanties ou vérifiées en temps réel.</div></section>`}
function renderCapital(){const a=state.allocation,total=Object.values(a).reduce((p,c)=>p+Number(c||0),0),valid=total===100,p=Number(state.payout)||0;const rows=[['amplify','Tag Markets Amplify','Simulation de réinjection'],['owned','Capital propre','Capital réellement détenu'],['reserve','Réserve','Liquidité et imprévus'],['challenges','Nouveaux challenges','FTMO / E8 / autres']];return `<section class="section-head"><div><div class="eyebrow">P4 / GENESIS</div><h1>Consolidation du capital</h1><p class="headline-sub">Les comptes financés sont des sources potentielles de payouts. Ils ne doivent pas être confondus avec du capital propre.</p></div></section><div class="subgrid"><section class="panel"><div class="panel-header"><h2>Écosystème des comptes</h2><span class="sub">Statuts issus du projet</span></div><div class="account-list">${state.accounts.map(x=>`<div class="account-line"><div><b>${esc(x.name)}</b><small>${esc(x.kind)} · ${esc(x.details)}</small><small>${esc(x.source)}</small></div>${pill(x.status)}</div>`).join('')}</div></section><section class="panel"><div class="panel-header"><h2>Simulateur de répartition</h2><span class="sub">Hypothèses modifiables</span></div><div style="margin-bottom:15px"><label class="muted small" for="payout">Payout net disponible pour répartition ($)</label><input class="fieldinput" id="payout" type="number" min="0" step="100" value="${esc(state.payout)}"></div><div class="capital-bars">${rows.map(([key,label,sub])=>`<div><div class="alloc-row"><label><b>${esc(label)}</b><div class="muted tiny">${esc(sub)}</div></label><input type="number" min="0" max="100" step="5" data-alloc="${key}" value="${esc(a[key])}" aria-label="${esc(label)} pourcentage"><span class="muted mono">${fmt(p*Number(a[key]||0)/100)} $</span></div><div class="alloc-bar"><i style="width:${Math.min(100,Math.max(0,Number(a[key]||0)))}%"></i></div></div>`).join('')}</div><div class="sep"></div><div class="detail-head"><div><b>Total des allocations : ${fmt(total)} %</b><div class="muted small">Répartition valable uniquement si le total est 100 %.</div></div>${valid?pill('done','Équilibrée'):pill('blocked','À corriger')}</div>${!valid?'<div class="errline">La somme des pourcentages doit atteindre exactement 100 %.</div>':''}<div class="sim-result"><div class="tile"><span class="muted small">Payout à répartir</span><b>${fmt(p)} $</b></div><div class="tile"><span class="muted small">Déploiement autorisé</span><b style="font-size:16px">Simulation seule</b></div></div><div class="source">Amplify ×12 : capacité de trading annoncée, non patrimoine de 12× le dépôt. Vérifier les risques de levier, de contrepartie et de retrait avant toute décision réelle.</div></section></div><div style="height:16px"></div><section class="panel"><h2>Chaîne de financement GENESIS</h2><div class="flow-map"><div class="flowbox"><b>REVENUS</b><span>Payouts réellement obtenus</span></div><div class="flowarrow">→</div><div class="flowbox"><b>ALLOCATION</b><span>Capital / Amplify / réserve / challenges</span></div><div class="flowarrow">→</div><div class="flowbox"><b>AUTONOMIE</b><span>Capital propre + diversification</span></div></div><div class="alertbox">${icon('alert')}<p>Le patrimoine consolidé et les performances en temps réel ne sont pas affichés : aucun solde de broker n'est connecté. Ne renseigne pas de mots de passe ou de clés API dans ce fichier.</p></div></section>`}
function renderTasks(){const ts=state.tasks.filter(t=>(taskFilter==='all'||(taskFilter==='open'?t.status!=='done':t.status===taskFilter))&&[t.title,t.project,t.owner,t.note].join(' ').toLowerCase().includes(query.toLowerCase()));return `<section class="section-head"><div><div class="eyebrow">EXECUTION BOARD</div><h1>Backlog opérationnel</h1><p class="headline-sub">Missions identifiées par programme (ex. P1-01). Priorités : CRITIQUE, HAUTE, NORMALE. Une tâche terminée n'est pas forcément un bot opérationnel.</p></div><button class="btn primary" id="add-task-page">＋ Nouvelle tâche</button></section><section class="panel"><div class="task-toolbar"><input id="filter-search" class="fieldinput" placeholder="Chercher projet, tâche ou pilote" style="max-width:380px" value="${esc(query)}"><span class="small muted">${ts.length} action(s) affichée(s)</span></div><div class="tabfilter">${[['all','Toutes'],['open','À traiter'],['todo','À faire'],['doing','En cours'],['blocked','Bloquées'],['done','Terminées']].map(([k,n])=>`<button class="filter ${taskFilter===k?'active':''}" data-taskfilter="${k}">${n}</button>`).join('')}</div><div class="task-list">${ts.map(t=>`<div class="task-item"><div><b>${esc(missionRef(t))} — ${esc(t.title)}</b><p>${esc(t.note||'Aucune note')}</p><div class="labels"><span class="tag">Programme ${esc(t.project)}</span>${priorityBadge(t.priority)}${pill(t.status)}<span class="muted tiny">${esc(t.owner)}</span></div></div><div class="actions">${t.status!=='done'?`<button data-done="${t.id}" title="Marquer terminée">✓</button>`:''}<button data-task="${t.id}">Modifier</button></div></div>`).join('')}${ts.length?'':'<div class="empty">Aucune tâche pour ces filtres.</div>'}</div></section>`}
function renderJournal(){return `<section class="section-head"><div><div class="eyebrow">GOUVERNANCE ET TRAÇABILITÉ</div><h1>Journal de commande</h1><p class="headline-sub">Notes, arbitrages, exports et sources de données. Le journal est conservé localement sur cet appareil.</p></div></section><div class="subgrid"><section class="panel"><div class="panel-header"><h2>Décisions / consignes</h2></div><div class="formfield"><label for="decision-note">Nouvelle décision</label><textarea id="decision-note" rows="3" placeholder="Ex. : Priorité à la parité One Shot MNQ avant toute activation..."></textarea></div><div style="display:flex;justify-content:flex-end;margin-top:10px"><button id="add-note" class="btn primary">Enregistrer une décision</button></div><div class="sep"></div><div class="notes">${state.notes.map(n=>`<div class="note"><b>${esc(n.at)}</b><p>${esc(n.text)}</p></div>`).join('')}</div></section><section class="panel"><div class="panel-header"><h2>Historique des changements</h2></div><ul class="log">${state.events.slice(0,25).map(e=>`<li><span class="time">${esc(e.at)}</span><span class="info">${esc(e.text)}</span></li>`).join('')}</ul><div class="sep"></div><h3>Sauvegarde et transfert</h3><p class="small">Utilise l'export JSON pour déplacer l'état du tableau vers un autre navigateur. Les sauvegardes ne sont pas transmises à ChatGPT ni à GitHub.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="export-inner">⇩ Export JSON</button><button class="btn" id="import-inner">⇧ Import JSON</button><button class="btn danger" id="reset-inner">Restaurer le modèle initial</button></div></section></div><div style="height:16px"></div><section class="panel"><h2>Intégrations futures</h2><p class="small">Les dépôts internes et leurs liens ne sont pas publiés dans cette démonstration.</p><div class="account-list"><div class="account-line"><div><b>GitHub — recherche</b><small>Workflows MT5, études One Shot, fichiers de recherche</small></div><a href="https://github.com" target="_blank" rel="noopener">Ouvrir ↗</a></div><div class="account-line"><div><b>GitHub — stratégie</b><small>Recovery Shift V3 et workflows de test</small></div><a href="https://github.com" target="_blank" rel="noopener">Ouvrir ↗</a></div></div></section>`}
function bindView(){document.querySelectorAll('[data-p5]').forEach(el=>el.onchange=e=>{const key=e.target.dataset.p5,val=Number(e.target.value);if(!Number.isFinite(val))return;const limits={balance:[0,100000000],scenarioPct:[0.1,25],riskPct:[0.1,10]};const [low,high]=limits[key]||[0,100];state.p5[key]=Math.max(low,Math.min(high,val));save();render();});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>toPage(b.dataset.nav));document.querySelectorAll('[data-kpi]').forEach(b=>b.onclick=()=>{const target=b.dataset.kpi;toPage(target==='programs'?'programs':'tasks',target==='programs'?'all':target)});document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{focused=b.dataset.project;toPage('programs')});document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{focused=b.dataset.focus;render();document.getElementById('project-detail')?.scrollIntoView({behavior:'smooth',block:'start'})});document.querySelectorAll('[data-editproject]').forEach(b=>b.onclick=()=>modalProject(b.dataset.editproject));document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>modalTask(b.dataset.task));document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const t=state.tasks.find(x=>x.id===b.dataset.done);if(t){t.status='done';act(`Tâche terminée : ${t.title}`);render();toast('Tâche mise à jour')}});document.querySelectorAll('[data-create-for]').forEach(b=>b.onclick=()=>modalTask(null,b.dataset.createFor));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();});document.querySelectorAll('[data-taskfilter]').forEach(b=>b.onclick=()=>{taskFilter=b.dataset.taskfilter;render()});const search=document.getElementById('filter-search');if(search){search.oninput=e=>{const pos=e.target.selectionStart;query=e.target.value;const area=document.activeElement;render();document.getElementById('filter-search').focus();document.getElementById('filter-search').setSelectionRange(pos,pos)}}const add=document.getElementById('add-task-page');if(add)add.onclick=()=>modalTask();const payout=document.getElementById('payout');if(payout)payout.onchange=e=>{state.payout=Math.max(0,Number(e.target.value)||0);save();render()};document.querySelectorAll('[data-alloc]').forEach(b=>b.onchange=e=>{state.allocation[e.target.dataset.alloc]=Math.max(0,Math.min(100,Number(e.target.value)||0));save();render()});const note=document.getElementById('add-note');if(note)note.onclick=()=>{const v=document.getElementById('decision-note').value.trim();if(!v){toast('Renseigner une décision.',true);return}state.notes.unshift({at:stamp(),text:v});act('Décision ajoutée au journal.');render();toast('Décision enregistrée')};const exportIn=document.getElementById('export-inner');if(exportIn)exportIn.onclick=exportData;const importIn=document.getElementById('import-inner');if(importIn)importIn.onclick=()=>document.getElementById('import-input').click();const reset=document.getElementById('reset-inner');if(reset)reset.onclick=()=>{if(confirm('Effacer les modifications locales et restaurer les données initiales ?')){state=clone(SEED);save();render();toast('Modèle restauré')}}}
function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('modal-content').innerHTML=''}
function openModal(html){document.getElementById('modal-content').innerHTML=html;document.getElementById('modal').classList.add('show');document.querySelectorAll('[data-close-modal]').forEach(b=>b.onclick=closeModal)}
function modalTask(id=null,chosen='P1'){const t=state.tasks.find(x=>x.id===id);openModal(`<div class="modalheader"><h2>${t?'Modifier':'Nouvelle'} action</h2><button class="iconbutton" data-close-modal>×</button></div><form id="task-form" class="formgrid"><div class="formfield"><label>Titre</label><input name="title" required maxlength="180" value="${esc(t?.title||'')}" placeholder="Livrable vérifiable"></div><div class="formfield"><label>Programme</label><select name="project">${state.projects.map(p=>`<option value="${p.id}" ${(t?.project||chosen)===p.id?'selected':''}>${p.id} — ${esc(p.name)}</option>`).join('')}</select></div><div class="formfield"><label>État</label><select name="status">${[['todo','À faire'],['doing','En cours'],['blocked','Bloqué'],['done','Terminé']].map(([v,l])=>`<option value="${v}" ${(t?.status||'todo')===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="formfield"><label>Priorité de l'action</label><select name="priority">${PRIORITY_OPTIONS.map(p=>`<option value="${p}" ${(t?.priority||'HAUTE')===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="formfield"><label>Pilote</label><input name="owner" maxlength="90" value="${esc(t?.owner||'Q BOT')}"></div><div class="formfield"><label>Critères de validation / notes</label><textarea name="note" rows="3">${esc(t?.note||'')}</textarea></div><div class="formbuttons">${t?'<button type="button" class="btn danger" id="remove-task">Supprimer</button>':''}<button type="button" class="btn" data-close-modal>Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></form>`);const form=document.getElementById('task-form');form.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));d.title=d.title.trim();if(!d.title)return;if(t){const moved=t.project!==d.project;Object.assign(t,d);if(moved)t.ref=nextMissionRef(state,d.project);}else state.tasks.push({...d,id:'T'+Date.now(),ref:nextMissionRef(state,d.project)});act(`${t?'Tâche modifiée':'Nouvelle tâche'} : ${d.title}`);closeModal();render();toast('Action enregistrée')};const rm=document.getElementById('remove-task');if(rm)rm.onclick=()=>{if(confirm('Supprimer définitivement cette tâche ?')){state.tasks=state.tasks.filter(x=>x.id!==t.id);act('Tâche supprimée : '+t.title);closeModal();render()}}}
function modalProject(id){const p=project(id);if(!p)return;openModal(`<div class="modalheader"><h2>Modifier ${p.id} — ${esc(p.name)}</h2><button class="iconbutton" data-close-modal>×</button></div><form id="project-form" class="formgrid"><div class="formfield"><label>Statut</label><select name="status">${[['cadrage','En cadrage'],['recherche','Recherche'],['en_cours','En développement'],['pilote','Pilote / simulation'],['blocked','Bloqué'],['done','Livré']].map(([v,l])=>`<option value="${v}" ${p.status===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="formfield"><label>Priorité du programme</label><select name="priority">${PRIORITY_OPTIONS.map(v=>`<option value="${v}" ${p.priority===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="formfield"><label>Pilote</label><input name="owner" required value="${esc(p.owner)}"></div><div class="formfield"><label>Prochain jalon</label><textarea name="next" rows="2">${esc(p.next)}</textarea></div><div class="formfield"><label>Risque / blocage majeur</label><textarea name="risk" rows="2">${esc(p.risk)}</textarea></div><div class="formbuttons"><button type="button" class="btn" data-close-modal>Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`);document.getElementById('project-form').onsubmit=e=>{e.preventDefault();Object.assign(p,Object.fromEntries(new FormData(e.currentTarget)));act(`Programme ${p.id} mis à jour (${statuslabel(p.status)})`);closeModal();render();toast('Programme actualisé')}}
function exportData(){const content=JSON.stringify({...state,exportedAt:stamp()},null,2);const a=document.createElement('a');const u=URL.createObjectURL(new Blob([content],{type:'application/json'}));a.href=u;a.download='qbot-control-center-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500);toast('Sauvegarde JSON exportée')}

async function shareApplication(){
  const title='Q BOT — Control Center';
  if(location.protocol==='https:' || location.protocol==='http:'){
    const url=location.href.split('#')[0];
    if(navigator.share){
      try{await navigator.share({title,text:'Voici le dashboard Q BOT Control Center.',url});return}
      catch(err){if(err?.name==='AbortError')return}
    }
    try{await navigator.clipboard.writeText(url);toast('Lien du site copié : envoie-le par WhatsApp.');return}
    catch(err){window.prompt('Copie cette adresse pour la partager :',url);return}
  }
  // Local file: share a safe self-contained HTML file, never the browser's localStorage state.
  const content='<!doctype html>\n'+document.documentElement.outerHTML;
  const file=new File([content],'QBOT_Control_Center_Demo.html',{type:'text/html'});
  try{
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({title,files:[file],text:'Dashboard Q BOT — version de démonstration.'});return;
    }
  }catch(err){if(err?.name==='AbortError')return}
  const blobUrl=URL.createObjectURL(file),a=document.createElement('a');
  a.href=blobUrl;a.download=file.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(blobUrl),1500);
  toast('Fichier téléchargé. Envoie-le via WhatsApp > Document.');
}

function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebar-backdrop').classList.remove('show')}
document.getElementById('menu-toggle').onclick=()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebar-backdrop').classList.toggle('show')};document.getElementById('sidebar-backdrop').onclick=closeMenu;document.getElementById('export-btn').onclick=exportData;document.getElementById('share-app-btn').onclick=shareApplication;document.getElementById('quick-add-btn').onclick=()=>modalTask();document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenu()}});document.getElementById('import-input').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.tasks)||!Array.isArray(data.projects)||!Array.isArray(data.accounts)||!Array.isArray(data.strategies)||!data.allocation)throw new Error('Structure incompatible');if(!confirm('Remplacer le tableau local actuel par le fichier importé ?'))return;state=migrateNomenclature(migrateP5(data));act('État du dashboard importé depuis un fichier JSON.');render();toast('État importé')}catch(err){toast('Import impossible : fichier invalide.',true)}finally{e.target.value=''}};
function updateClock(){document.getElementById('paris-clock').textContent=new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'}).format(new Date())+' Paris'}updateClock();setInterval(updateClock,60_000);render();updateServerStatus();setInterval(updateServerStatus,600_000);
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
