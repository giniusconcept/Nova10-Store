name: Upload NOVA10 Short to YouTube

on:
  workflow_dispatch:
  push:
    paths:
      - 'youtube-upload-trigger.txt'

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Validate YouTube token
        env:
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
        run: |
          if [ -z "$YOUTUBE_ACCESS_TOKEN" ]; then
            echo "Missing repository secret: YOUTUBE_ACCESS_TOKEN"
            exit 2
          fi

      - name: Upload exactly one NOVA10 Short
        id: youtube
        env:
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
        run: python scripts/upload_youtube_short.py

      - name: Publish result in job summary
        if: success()
        run: |
          echo "## YouTube upload completed" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.youtube.outputs.video_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Privacy: ${{ steps.youtube.outputs.privacy }}" >> "$GITHUB_STEP_SUMMARY"
