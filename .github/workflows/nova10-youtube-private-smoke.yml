name: NOVA10 - licensed REAL pressure-washing footage to YouTube PRIVATE
on:
  pull_request:
    paths:
      - ".github/workflows/nova10-youtube-private-smoke.yml"
permissions:
  contents: read
jobs:
  licensed-real-video:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg for authentic CC BY 3.0 video
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Retrieve real Wikimedia Commons video and create 25-second licensed clip
        run: python nova10-video-factory/src/prepare_cc_video.py
      - name: Upload authentic licensed excerpt to YouTube PRIVATE
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python nova10-video-factory/src/youtube_private_upload_smoke.py
