name: NOVA10 CJdropshipping connection audit
on:
  push:
    paths:
      - '.github/workflows/cj-nova10-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cj-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
      CJ_ACCESS_TOKEN: ${{ secrets.CJ_ACCESS_TOKEN }}
    steps:
      - name: Audit authorized CJ account and nozzle candidates (no product creation)
        shell: bash
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,sys
          from datetime import datetime,timezone
          report={'at':datetime.now(timezone.utc).isoformat(),'store':'NOVA10','phase':'CJ audit','status':'blocked'}
          def write():
              with open('cj-audit.json','w') as f: json.dump(report,f,indent=2)
              print('AUDIT_STATUS:',report['status'],report.get('reason',''))
          token=os.getenv('CJ_ACCESS_TOKEN','').strip()
          key=os.getenv('CJ_API_KEY','').strip()
          base='https://developers.cjdropshipping.com/api2.0/v1'
          def request(endpoint,headers=None,payload=None):
              req=urllib.request.Request(base+endpoint,data=payload,headers=headers or {},method='POST' if payload else 'GET')
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          try:
              if not token and not key:
                  report['reason']='missing_CJ_API_KEY_or_CJ_ACCESS_TOKEN_secret'
                  write();sys.exit(2)
              if not token:
                  auth=request('/authentication/getAccessToken',{'Content-Type':'application/json'},json.dumps({'apiKey':key}).encode())
                  if not auth.get('result'):raise ValueError('CJ token exchange refused: '+str(auth.get('code')))
                  token=auth['data']['accessToken']
              hdr={'CJ-Access-Token':token}
              shops=request('/shop/getShops',hdr)
              print('CJ_SHOP_RESPONSE_META',json.dumps({'keys':list(shops.keys()),'code':shops.get('code'),'result':shops.get('result'),'data_type':type(shops.get('data')).__name__,'data_count':len(shops.get('data') or []) if isinstance(shops.get('data'),list) else None}))
              if not (shops.get('success') is True or shops.get('result') is True or shops.get('code')==0):raise ValueError('CJ shop list rejected: code='+str(shops.get('code'))+' message='+str(shops.get('message',''))[:140])
              matches=[{'id':s.get('id'),'name':s.get('name'),'status':s.get('status'),'type':s.get('type')} for s in shops.get('data',[]) if 'nova10' in str(s.get('name','')).lower()]
              print('CJ_SHOPS_SUMMARY', json.dumps([{'name':x.get('name'),'status':x.get('status'),'type':x.get('type')} for x in matches]))
              report['shops']=matches
              if len(matches)!=1 or matches[0]['status']!=1:
                  report['reason']='NOVA10_not_uniquely_authorized_in_CJ'
                  write();sys.exit(3)
              q=urllib.parse.urlencode({'page':1,'size':20,'keyWord':'pressure washer nozzle'})
              result=request('/product/listV2?'+q,hdr)
              if not result.get('result'):raise ValueError('CJ search rejected: '+str(result.get('code')))
              data=result.get('data') or {}
              # Limited metadata only; do not leak credentials or create products.
              report['candidate_data_keys']=list(data) if isinstance(data,dict) else []
              print('CJ_PRODUCT_DATA_STRUCTURE',json.dumps({'keys':list(data) if isinstance(data,dict) else [],'types':{k:type(v).__name__ for k,v in data.items()} if isinstance(data,dict) else {}}))
              def summarize(v):
                  fields=['pid','productId','productName','productImage','productImageUrl','productPrice','sellPrice','productSku','sku','vid','variantId','variantSku','price','name','image']
                  return {k:v[k] for k in fields if isinstance(v,dict) and k in v and isinstance(v[k],(str,int,float))}
              found=[]
              def collect(v,depth=0):
                  if depth>4 or len(found)>=15:return
                  if isinstance(v,list):
                      for item in v:collect(item,depth+1)
                  elif isinstance(v,dict):
                      s=summarize(v)
                      if ('pid' in s or 'productId' in s) and len(s)>1:found.append(s)
                      for child in v.values():
                          if isinstance(child,(list,dict)):collect(child,depth+1)
              collect(data)
              print('CJ_PRODUCT_CANDIDATES',json.dumps(found,ensure_ascii=False)[:9500])
              print('CJ_SEARCH_SUMMARY',json.dumps({'totalRecords':data.get('totalRecords'),'content_count':len(data.get('content') or []),'sample':[{k:str(v)[:160] for k,v in e.items() if k in ('id','pid','productName','productImage','sellPrice','productPrice','sku','productSku','productId','name','productType','productSellPrice')} for e in (data.get('content') or [])[:8]]} if isinstance(data,dict) else {}))
              report['candidates']=found
              print('CJ_PRODUCT_FIELDS',json.dumps(list((data.get('content') or [{}])[0].get('productList',[{}])[0].keys())))
              print('CJ_PRODUCTS_SAMPLE',json.dumps([{k:str(v)[:180] for k,v in item.items() if k in ('pid','id','productId','productName','productImage','productPrice','sellPrice','productSku','name','productSellPrice','productImageUrl','productNameEn','nameEn','bigImage','currency','totalVerifiedInventory','totalUnVerifiedInventory')} for entry in (data.get('content') or []) for item in (entry.get('productList') or [])[:20]])[:11500])
              print('CJ_CONTENT_STRUCTURE',json.dumps([{'keys':list(e.keys()),'child_lists':{k:len(v) for k,v in e.items() if isinstance(v,list)},'child_dicts':{k:list(v.keys()) for k,v in e.items() if isinstance(v,dict)}} for e in (data.get('content') or [])[:2] if isinstance(e,dict)]))
              report['status']='review_required'
              report['reason']='CJ_authorized_search_completed_product_PID_VID_and_listing_options_require_review'
          except Exception as exc:
              report['status']='blocked'
              report['reason']=type(exc).__name__+': '+str(exc)[:160]
          write()
          if report['status']=='blocked':sys.exit(4)
          PY
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cj-nova10-audit
          path: cj-audit.json
          if-no-files-found: warn

# Connection retest after CJ_API_KEY configured, 2026-11-08
