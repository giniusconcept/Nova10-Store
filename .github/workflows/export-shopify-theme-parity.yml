name: Export NOVA10 Shopify Theme Parity

on:
  push:
    paths:
      - '.github/workflows/export-shopify-theme-parity.yml'

permissions:
  contents: read

jobs:
  export-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Download Shopify bulk theme export
        env:
          BULK_URL: >-
            https://storage.googleapis.com/shopify-tiers-assets-prod-us-east1/bulk-operation-outputs/0b331a3f33491a75592a627cc07c?GoogleAccessId=assets-us-prod%40shopify-tiers.iam.gserviceaccount.com&Expires=1791023274&Signature=YRc5LY9o89CxUtVV3h%2BJxvAs5MYl0W6AAHK7VLX5eXGpJg2q9YtzjndZ%2FBiyrfKvEz0TOmowjVvGRuW5CaO3ry0hx4lvVMjmNq21hrMT6%2FfAbsMmgviQEuwjY1%2BlN%2Fo2wsd54JY2llFpH4yxy9QVjhdEXaOfUiQsKPcemWV5lUX1STHB88G4iSIblsaEDs%2FvlZbFgCcfZAygJ5C6Lo%2BDC1s6%2BaIXQ2FCEYBsBVMqUHP2x0%2FXAVqOCO16sVce11kVmt0ooht4%2BY%2BTEiYBshuVVNliVvlTqpo0D2TkY0bpR1WhrhvLE27rhjhIvU5wi8NvPZ2Xif63y68l1b%2FX3F%2BnyQ%3D%3D&response-content-disposition=attachment%3B+filename%3D%22staging-bulk-10846789173590.jsonl%22%3B+filename%2A%3DUTF-8%27%27staging-bulk-10846789173590.jsonl&response-content-type=application%2Fjsonl
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$BULK_URL" --output theme.jsonl
          test -s theme.jsonl
          test "$(wc -l < theme.jsonl)" -eq 490

      - name: Rebuild exact theme ZIP
        run: |
          python - <<'PY'
          import base64, json, pathlib, shutil, urllib.request, zipfile
          src=pathlib.Path('theme.jsonl'); root=pathlib.Path('theme'); out=pathlib.Path('NOVA10-Final-Shopify-Theme.zip')
          if root.exists(): shutil.rmtree(root)
          root.mkdir(); written=0
          def locate(o):
              if isinstance(o,dict):
                  if isinstance(o.get('filename'),str) and 'body' in o: return o
                  for v in o.values():
                      r=locate(v)
                      if r:return r
              if isinstance(o,list):
                  for v in o:
                      r=locate(v)
                      if r:return r
          for raw in src.read_text(encoding='utf-8').splitlines():
              if not raw.strip(): continue
              obj=json.loads(raw); item=locate(obj) or obj; fn=item.get('filename'); body=item.get('body') or {}
              if not fn: continue
              rel=pathlib.PurePosixPath(fn)
              if rel.is_absolute() or '..' in rel.parts: raise RuntimeError(fn)
              target=root.joinpath(*rel.parts); target.parent.mkdir(parents=True,exist_ok=True)
              if body.get('content') is not None: data=body['content'].encode('utf-8')
              elif body.get('contentBase64') is not None: data=base64.b64decode(body['contentBase64'])
              elif body.get('url'):
                  req=urllib.request.Request(body['url'],headers={'User-Agent':'Mozilla/5.0 NOVA10-theme-export'})
                  with urllib.request.urlopen(req,timeout=120) as r:data=r.read()
              else: continue
              target.write_bytes(data); written+=1
          if written!=490: raise RuntimeError(f'{written} files reconstructed, expected 490')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(root).as_posix())
          with zipfile.ZipFile(out,'r') as z:
              if len([n for n in z.namelist() if not n.endswith('/')])!=490: raise RuntimeError('bad zip file count')
          print('theme-files',written,'zip-bytes',out.stat().st_size)
          PY

      - name: Upload exact theme export
        uses: actions/upload-artifact@v4
        with:
          name: NOVA10-Final-Shopify-Theme-Exact
          path: NOVA10-Final-Shopify-Theme.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
