name: NOVA10 real Shopify product - internal video preview
on:
  pull_request:
    paths:
      - "nova10-video-factory/src/preview.py"
      - "nova10-video-factory/config/shopify_preview.json"
      - "nova10-video-factory/tests/test_preview.py"
      - ".github/workflows/nova10-real-product-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nova10-video-factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install "pillow>=11,<13"
      - name: Security and unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate actual Shopify photo preview (NOT advertising)
        run: python src/preview.py
      - name: Archive preview with SHA-256
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova10-shopify-internal-preview
          path: |
            nova10-video-factory/output/nova10-buse-preview.mp4
            nova10-video-factory/output/shopify_real_product_preview.png
            nova10-video-factory/output/preview_audit.json
          retention-days: 7
          if-no-files-found: warn
