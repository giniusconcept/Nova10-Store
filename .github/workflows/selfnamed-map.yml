name: Selfnamed -> NOVA10 mapping

on:
  push:
    paths:
      - 'scripts/selfnamed-map.mjs'
      - '.github/workflows/selfnamed-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-selfnamed-product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SELFNAMED_STORAGE_STATE_B64: ${{ secrets.SELFNAMED_STORAGE_STATE_B64 }}
      SELFNAMED_STORAGE_STATE_PATH: .auth/selfnamed.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore Selfnamed Google session
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .auth
          if [ -z "${SELFNAMED_STORAGE_STATE_B64:-}" ]; then
            echo '{"status":"blocked","reason":"missing_selfnamed_google_session","required":["SELFNAMED_STORAGE_STATE_B64"]}' > selfnamed-map-status.json
            exit 2
          fi
          printf '%s' "$SELFNAMED_STORAGE_STATE_B64" | base64 --decode > .auth/selfnamed.json
          node -e "JSON.parse(require('fs').readFileSync('.auth/selfnamed.json','utf8')); console.log('Selfnamed session JSON restored')"

      - name: Install Playwright
        if: success()
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Map Selfnamed product to NOVA10
        if: success()
        id: map
        shell: bash
        run: |
          set +e
          node scripts/selfnamed-map.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload audit status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfnamed-map-audit
          path: selfnamed-map-status.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce mapping result
        if: always()
        shell: bash
        run: |
          test -f selfnamed-map-status.json
          grep -q '"status":"success"' selfnamed-map-status.json || grep -q '"status": "success"' selfnamed-map-status.json
