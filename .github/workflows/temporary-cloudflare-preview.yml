name: Temporary Cloudflare Preview

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy temporary Cloudflare preview
        run: npx --yes wrangler@latest deploy --temporary
