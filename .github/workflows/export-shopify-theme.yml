name: Export NOVA10 Shopify Theme

on:
  push:
    paths:
      - '.github/workflows/export-shopify-theme.yml'
      - 'shopify-theme-export-trigger.txt'

permissions:
  contents: read

jobs:
  export-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Download Shopify bulk theme export
        env:
          BULK_URL: >-
            https://storage.googleapis.com/shopify-tiers-assets-prod-us-east1/bulk-operation-outputs/0b331a3f33491a75592a627cc07c?GoogleAccessId=assets-us-prod%40shopify-tiers.iam.gserviceaccount.com&Expires=1791023274&Signature=YRc5LY9o89CxUtVV3h%2BJxvAs5MYl0W6AAHK7VLX5eXGpJg2q9YtzjndZ%2FBiyrfKvEz0TOmowjVvGRuW5CaO3ry0hx4lvVMjmNq21hrMT6%2FfAbsMmgviQEuwjY1%2BlN%2Fo2wsd54JY2llFpH4yxy9QVjhdEXaOfUiQsKPcemWV5lUX1STHB88G4iSIblsaEDs%2FvlZbFgCcfZAygJ5C6Lo%2BDC1s6%2BaIXQ2FCEYBsBVMqUHP2x0%2FXAVqOCO16sVce11kVmt0ooht4%2BY%2BTEiYBshuVVNliVvlTqpo0D2TkY0bpR1WhrhvLE27rhjhIvU5wi8NvPZ2Xif63y68l1b%2FX3F%2BnyQ%3D%3D&response-content-disposition=attachment%3B+filename%3D%22staging-bulk-10846789173590.jsonl%22%3B+filename%2A%3DUTF-8%27%27staging-bulk-10846789173590.jsonl&response-content-type=application%2Fjsonl
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$BULK_URL" --output theme.jsonl
          test -s theme.jsonl
          wc -l theme.jsonl

      - name: Rebuild exact theme directory and ZIP
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, shutil, urllib.request, zipfile

          src = pathlib.Path('theme.jsonl')
          root = pathlib.Path('theme')
          out = pathlib.Path('NOVA10-Final-Shopify-Theme.zip')
          if root.exists(): shutil.rmtree(root)
          root.mkdir()

          written = 0
          verified = 0
          skipped = []

          def locate_file_object(obj):
              if isinstance(obj, dict):
                  if isinstance(obj.get('filename'), str) and 'body' in obj:
                      return obj
                  for value in obj.values():
                      found = locate_file_object(value)
                      if found:
                          return found
              elif isinstance(obj, list):
                  for value in obj:
                      found = locate_file_object(value)
                      if found:
                          return found
              return None

          for lineno, raw in enumerate(src.read_text(encoding='utf-8').splitlines(), 1):
              if not raw.strip():
                  continue
              obj = json.loads(raw)
              item = locate_file_object(obj) or obj
              filename = item.get('filename')
              body = item.get('body') or {}
              if not filename:
                  skipped.append((lineno, 'missing filename'))
                  continue
              rel = pathlib.PurePosixPath(filename)
              if rel.is_absolute() or '..' in rel.parts:
                  raise RuntimeError(f'Unsafe filename: {filename}')
              target = root.joinpath(*rel.parts)
              target.parent.mkdir(parents=True, exist_ok=True)

              data = None
              if body.get('content') is not None:
                  data = body['content'].encode('utf-8')
              elif body.get('contentBase64') is not None:
                  data = base64.b64decode(body['contentBase64'])
              elif body.get('url'):
                  req = urllib.request.Request(body['url'], headers={'User-Agent':'Mozilla/5.0 NOVA10-theme-export'})
                  with urllib.request.urlopen(req, timeout=120) as r:
                      data = r.read()
              else:
                  skipped.append((lineno, f'no body for {filename}'))
                  continue

              target.write_bytes(data)
              written += 1
              expected = item.get('checksumMd5')
              if expected:
                  got = hashlib.md5(data).hexdigest()
                  if got != expected:
                      raise RuntimeError(f'MD5 mismatch for {filename}: {got} != {expected}')
                  verified += 1

          if written < 400:
              raise RuntimeError(f'Only {written} theme files reconstructed; expected about 490')

          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p, p.relative_to(root).as_posix())

          with zipfile.ZipFile(out, 'r') as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError(f'ZIP integrity failure at {bad}')
              count = len([n for n in z.namelist() if not n.endswith('/')])
          print(json.dumps({'written': written, 'md5_verified': verified, 'zip_files': count, 'zip_bytes': out.stat().st_size, 'skipped': skipped[:20]}, ensure_ascii=False))
          PY

      - name: Upload theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NOVA10-Final-Shopify-Theme
          path: NOVA10-Final-Shopify-Theme.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
